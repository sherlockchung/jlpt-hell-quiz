<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An-Yu's JLPT 地獄特訓 (全讀音版)</title>
    <style>
        :root {
            --primary: #b91c1c; /* Red 700 - 更有壓迫感的紅 */
            --primary-hover: #991b1b;
            --success: #15803d;
            --error: #dc2626;
            --bg: #1c1917; /* Dark background */
            --card: #292524;
            --text-main: #e7e5e4;
            --text-sub: #a8a29e;
        }

        body {
            font-family: 'Hiragino Sans', 'Meiryo', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .container {
            background-color: var(--card);
            width: 100%;
            max-width: 700px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 35px;
            position: relative;
            border: 1px solid #44403c;
        }

        h1 {
            color: #f87171;
            font-size: 2rem;
            margin: 0 0 10px 0;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* 狀態條 */
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #44403c;
            border-radius: 99px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #ef4444;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px #ef4444;
        }

        /* 題目卡片 */
        .quiz-card {
            background: #0c0a09;
            border: 1px solid #44403c;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .tag {
            background: #7f1d1d;
            color: #fecaca;
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid #991b1b;
        }

        .word-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: #fafaf9;
            margin: 15px 0;
            letter-spacing: 4px;
        }

        /* 選項按鈕 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
            .word-text { font-size: 2.5rem; }
            .container { padding: 20px; }
        }

        button.opt-btn {
            background: #292524;
            border: 1px solid #57534e;
            color: #d6d3d1;
            padding: 20px;
            border-radius: 14px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.1s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            position: relative;
        }

        button.opt-btn:hover:not(:disabled) {
            border-color: #f87171;
            background: #450a0a;
            color: white;
            transform: scale(1.02);
        }

        button.opt-btn.correct {
            background: #064e3b;
            color: #4ade80;
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }

        button.opt-btn.wrong {
            background: #450a0a;
            color: #f87171;
            border-color: #ef4444;
            text-decoration: line-through;
            opacity: 0.7;
        }

        .feedback-area {
            min-height: 30px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #f87171;
        }

        .btn-primary {
            background: #b91c1c;
            color: white;
            border: none;
            padding: 16px 45px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(185, 28, 28, 0.4);
        }
        .btn-primary:hover { 
            background: #991b1b;
            transform: translateY(-2px);
        }

        .hidden { display: none !important; }
    </style>
</head>

<div class="container">
    <div id="start-screen">
        <h1>JLPT 地獄特訓</h1>
        <div class="subtitle">
            模式：全漢字 ➔ 選拼音<br>

        </div>

            <ul style="margin: 10px 0 0 20px; padding: 0; line-height: 1.8;">

                <li>錯題會無情地重新排入隊列，直到你選對為止。</li>
            </ul>
        </div>
        <button class="btn-primary" onclick="startQuiz()">接受挑戰</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="stats-row">
            <span id="progress-text">Progress: 0 / 20</span>
            <span id="queue-text">Queue: 20</span>
        </div>
        <div class="progress-track">

        </div>

        <div class="options-grid" id="options-container"></div>
        <div class="feedback-area" id="feedback-msg"></div>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">

</div>

        {kanji: "共有", kana: "きょうゆう", meaning: "共享"}
    ];

    let quizQueue = [];
    let wrongCount = 0;
    const TARGET_QUESTIONS = 20;

    // ============================================
    // 魔鬼干擾項生成器 (Evil Distractor Generator)
    // ============================================
    function generateEvilDistractors(correctKana) {
        let distractors = new Set();
        let attempts = 0;

        // 規則 1: 優先加入手動定義的 "Traps"
        // (需在呼叫前處理，這裡處理純演算法部分)

        while (distractors.size < 3 && attempts < 100) {
            attempts++;
            let fake = correctKana;
            const strategy = Math.floor(Math.random() * 8); // 8種惡意策略

            // 1. 清濁音反轉 (Classic JLPT Trap)
            if (strategy === 0) {
                fake = fake.replace(/[かきくけこ]/g, m => String.fromCharCode(m.charCodeAt(0) + 1)) // ka -> ga
                           .replace(/[がぎぐげご]/g, m => String.fromCharCode(m.charCodeAt(0) - 1)) // ga -> ka
                           .replace(/[たちつてと]/g, m => String.fromCharCode(m.charCodeAt(0) + 1)) // ta -> da
                           .replace(/[だぢづでど]/g, m => String.fromCharCode(m.charCodeAt(0) - 1)) // da -> ta
                           .replace(/[さしすせそ]/g, m => String.fromCharCode(m.charCodeAt(0) + 1)) // sa -> za
                           .replace(/[ざじずぜぞ]/g, m => String.fromCharCode(m.charCodeAt(0) - 1)); // za -> sa
            }
            // 2. 長音地獄 (Chouon Hell)
            else if (strategy === 1) {
                if (fake.includes('う')) fake = fake.replace('う', ''); // 移除長音
                else if (fake.match(/[おこぞとどのもろよ]/)) fake += 'う'; // 添加o段長音
                else if (fake.match(/[えけせてねめれ]/)) fake += 'い'; // 添加e段長音
                else if (fake.match(/[あかさたなはまやらわ]/)) fake += 'あ'; // 添加a段長音
            }
            // 3. 促音陷阱 (Sokuon Trap)
            else if (strategy === 2) {
                if (fake.includes('っ')) fake = fake.replace('っ', 'つ'); // 移除促音
                else if (fake.includes('っ') === false && fake.length > 2) {
                    // 隨機插入促音
                    const pos = 1; 
                    fake = fake.slice(0, pos) + 'っ' + fake.slice(pos);
                }
            }
            // 4. 自動詞/他動詞混淆 (Transitivity)
            else if (strategy === 3) {
                if (fake.endsWith('かる')) fake = fake.replace('かる', 'ける');
                else if (fake.endsWith('ける')) fake = fake.replace('ける', 'かる');
                else if (fake.endsWith('ある')) fake = fake.replace('ある', 'える');
                else if (fake.endsWith('える')) fake = fake.replace('える', 'ある');
                else if (fake.endsWith('む')) fake = fake.replace('む', 'める');
            }
            // 5. 拗音消失/產生 (Youon)
            else if (strategy === 4) {
                 if (fake.includes('ゃ')) fake = fake.replace('ゃ', '');
                 else if (fake.includes('ゅ')) fake = fake.replace('ゅ', '');
                 else if (fake.includes('ょ')) fake = fake.replace('ょ', '');
                 else if (fake.includes('き')) fake = fake.replace('き', 'きょ');
                 else if (fake.includes('し')) fake = fake.replace('し', 'しゃ');
                 else if (fake.includes('ち')) fake = fake.replace('ち', 'ちゃ');
            }
            // 6. 尾音變化 (Okurigana mistake simulation)
            else if (strategy === 5) {
                const endings = ['い', 'く', 'つ', 'る', 'む'];
                fake = fake.slice(0, -1) + endings[Math.floor(Math.random() * endings.length)];
            }
            // 7. 音讀/訓讀混淆 (模擬)
            else if (strategy === 6) {
                // 簡單的替換規則，模擬常見錯誤
                if (fake.startsWith('お')) fake = fake.replace('お', 'ご'); // O -> Go
                else if (fake.startsWith('ご')) fake = fake.replace('ご', 'お'); // Go -> O
                else if (fake.startsWith('き')) fake = fake.replace('き', 'け'); 
            }
            // 8. 隨機微調
            else {
                 if (fake.includes('い')) fake = fake.replace('い', 'え');
                 else if (fake.includes('え')) fake = fake.replace('え', 'い');
            }

            // 檢查有效性
            if (fake !== correctKana && fake.length >= 1 && fake !== 'undefined') {
                distractors.add(fake);
            }
        }
        return Array.from(distractors);
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // ============================================
    // 測驗流程
    // ============================================
    function startQuiz() {
        // 從資料庫隨機抓 20 題
        const shuffledWords = shuffle([...rawData]).slice(0, TARGET_QUESTIONS);
        
        // 全部轉為 READING 題型
        quizQueue = shuffledWords.map(word => {
            // 準備干擾項
            let options = [];
            
            // 1. 如果有手動 Traps，先加進來
            if (word.traps && word.traps.length > 0) {
                options = [...word.traps];
            }
            
            // 2. 如果不夠 3 個，用演算法補
            const generated = generateEvilDistractors(word.kana);
            for (let g of generated) {
                if (options.length >= 3) break;
                if (!options.includes(g)) options.push(g);
            }
            
            // 3. 還不夠？從資料庫隨機抓發音相近的
            while (options.length < 3) {
                const randomWord = rawData[Math.floor(Math.random() * rawData.length)];
                if (randomWord.kana !== word.kana && !options.includes(randomWord.kana)) {
                    options.push(randomWord.kana);
                }
            }
            
            // 加入正解並打亂
            options.push(word.kana);
            options = shuffle(options);

            return {
                text: word.kanji,
                correct: word.kana,
                options: options,
                raw: word
            };
        });

        wrongCount = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        if (quizQueue.length === 0) {
            showResult();
            return;
        }

        const q = quizQueue[0];
        const remaining = quizQueue.length;
        const progress = TARGET_QUESTIONS - remaining;
        const percentage = Math.min((progress / TARGET_QUESTIONS) * 100, 100);

        document.getElementById('progress-text').innerText = `已完成: ${progress} / ${TARGET_QUESTIONS}`;
        document.getElementById('queue-text').innerText = `剩餘: ${remaining}`;
        document.getElementById('progress-fill').style.width = `${percentage}%`;

        document.getElementById('q-word').innerText = q.text;
        document.getElementById('feedback-msg').innerText = '';

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(btn, opt, q);
            container.appendChild(btn);
        });
    }

    function handleAnswer(btn, selected, q) {
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selected === q.correct) {
            btn.classList.add('correct');
            document.getElementById('feedback-msg').style.color = '#4ade80';
            document.getElementById('feedback-msg').innerText = '正解！ ⭕';
            
            setTimeout(() => {
                quizQueue.shift();
                renderQuestion();
            }, 800);
        } else {
            btn.classList.add('wrong');
            wrongCount++;
            
            allBtns.forEach(b => {
                if (b.innerText === q.correct) b.classList.add('correct');
            });

            document.getElementById('feedback-msg').style.color = '#ef4444';
            document.getElementById('feedback-msg').innerText = `錯誤！ (${q.text} = ${q.correct})`;

            // 錯題懲罰：重新排入
            const retryQ = quizQueue.shift();
            retryQ.options = shuffle(retryQ.options);
            quizQueue.push(retryQ);

            setTimeout(() => {
                renderQuestion();
            }, 2500);
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('result-stats').innerHTML = 
            `本次死亡次數：${wrongCount} 次`;
    }
